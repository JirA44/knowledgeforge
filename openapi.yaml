components:
  schemas:
    ClaimCreate:
      properties:
        statement:
          type: string
          maxLength: 20000
          minLength: 3
          title: Statement
        context:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Context
        declared_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Declared Confidence
      additionalProperties: false
      type: object
      required:
      - statement
      title: ClaimCreate
    ClaimEvolutionDossierCreate:
      properties:
        claim_version_ids:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 2
          title: Claim Version Ids
      additionalProperties: false
      type: object
      required:
      - claim_version_ids
      title: ClaimEvolutionDossierCreate
      description: Selects only persisted versions; all chronological measures are derived.
    ClaimRelationCreate:
      properties:
        related_claim_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Related Claim Id
        relation:
          type: string
          enum:
          - SUPPORTS
          - CONTRADICTS
          title: Relation
        from_version_number:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: From Version Number
        related_version_number:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Related Version Number
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - related_claim_id
      - relation
      title: ClaimRelationCreate
    ClaimVersionCreate:
      properties:
        statement:
          type: string
          maxLength: 20000
          minLength: 3
          title: Statement
        context:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Context
        declared_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Declared Confidence
        change_note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Change Note
        expected_current_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Current Version
      additionalProperties: false
      type: object
      required:
      - statement
      title: ClaimVersionCreate
    ContradictionDossierCreate:
      properties:
        claim_version_ids:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 2
          title: Claim Version Ids
      additionalProperties: false
      type: object
      required:
      - claim_version_ids
      title: ContradictionDossierCreate
      description: 'Selects only the immutable claim versions to compare.


        Depth, qualifications, evidence thresholds and every conclusion are fixed

        server policy and therefore cannot be supplied by a client.'
    CoverageReportCreate:
      properties:
        claim_version_number:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Claim Version Number
        as_of:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: As Of
      additionalProperties: false
      type: object
      title: CoverageReportCreate
      description: 'Selects the immutable claim version and reference date to snapshot.


        All coverage, freshness, integrity and qualification fields are deliberately

        absent: they are derived by the server.'
    EvidenceCreate:
      properties:
        source_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Source Id
        excerpt:
          type: string
          maxLength: 50000
          minLength: 1
          title: Excerpt
        locator:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Locator
        strength:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Strength
          default: 0.75
        relation:
          type: string
          enum:
          - SUPPORTS
          - CONTRADICTS
          title: Relation
        claim_version_number:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Claim Version Number
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - source_id
      - excerpt
      - relation
      title: EvidenceCreate
    EvidenceGapDossierCreate:
      properties:
        claim_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Claim Id
        claim_version_ids:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          title: Claim Version Ids
        evidence_ids:
          items:
            type: string
          type: array
          maxItems: 99
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - claim_id
      - claim_version_ids
      title: EvidenceGapDossierCreate
      description: Selects one claim and 2..100 persisted version/evidence references.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImpactReportCreate:
      properties:
        claim_version_number:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Claim Version Number
        max_depth:
          type: integer
          maximum: 8.0
          minimum: 1.0
          title: Max Depth
          default: 3
      additionalProperties: false
      type: object
      title: ImpactReportCreate
      description: 'Selects the root version and the bounded deterministic traversal.


        A qualification, affected claims and paths are intentionally absent: the

        server derives them exclusively from the stored relation graph.'
    ProvenanceDossierCreate:
      properties:
        claim_version_ids:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Claim Version Ids
      additionalProperties: false
      type: object
      required:
      - claim_version_ids
      title: ProvenanceDossierCreate
      description: Selects only immutable claim versions for source-independence analysis.
    SourceCreate:
      properties:
        url:
          type: string
          maxLength: 2048
          minLength: 3
          title: Url
        title:
          type: string
          maxLength: 500
          minLength: 1
          title: Title
        publisher:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Publisher
        published_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Published At
        reliability:
