openapi: 3.1.0
info:
  title: KnowledgeForge API
  summary: Registre traçable d'affirmations et d'éléments probants
  description: KnowledgeForge calcule des verdicts documentaires reproductibles à
    partir de liens explicites. Un verdict n'est jamais présenté comme une vérité
    factuelle.
  version: 1.0.7
